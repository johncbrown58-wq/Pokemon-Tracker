<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Update Pokémon Tracker</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;padding:32px 20px;line-height:1.45}
button{font:inherit;padding:14px 20px;border-radius:12px;border:1px solid #888;background:#fff}
#status{margin:20px auto;max-width:420px}
</style>
</head>
<body>
<h2>Update Pokémon Tracker</h2>
<p id="status">Preparing a safe app refresh. Your collection data will not be deleted.</p>
<button id="go" hidden>Continue to Pokémon Tracker</button>
<script>
(async()=>{
  const status=document.getElementById("status");
  const go=document.getElementById("go");
  const finish=()=>{
    go.hidden=false;
    go.onclick=()=>{ location.href="./?updated=19"; };
  };
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      status.textContent="Removing the old app worker…";
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if("caches" in window){
      status.textContent="Removing old app caches…";
      const names=await caches.keys();
      await Promise.all(names.filter(n=>n.startsWith("pokemon-tracker-")).map(n=>caches.delete(n)));
    }
    status.textContent="The old app files are cleared. Tap the button below to open the fresh version.";
    finish();
  }catch(e){
    status.textContent="Automatic cleanup was blocked by iPhone. Tap the button below; your collection data is still safe.";
    finish();
  }
})();
</script>
<noscript><p>JavaScript is required. Please enable JavaScript and reload this page.</p></noscript>
</body>
</html>
