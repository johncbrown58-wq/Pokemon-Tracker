<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pokémon Card Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1>Pokémon Card Tracker</h1>
    <p>Base • Jungle • Fossil</p>
  </div>
  <button id="offlineBtn" class="secondary">Prepare Offline</button>
</header>
<main>
  <section class="dashboard">
    <div class="stat"><strong id="ownedCount">0</strong><span>Owned</span></div>
    <div class="stat"><strong id="totalCount">0</strong><span>Total</span></div>
    <div class="stat"><strong id="percent">0%</strong><span>Complete</span></div>
  </section>
  <section class="controls">
    <input id="search" type="search" placeholder="Search Pokémon or Dex #">
    <div class="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="missing">Missing</button>
      <button data-filter="owned">Owned</button>
    </div>
    <div id="setTabs" class="filters"></div>
  </section>
  <div id="status" class="status">Loading your card list…</div>
  <section id="grid" class="grid"></section>
</main>
<footer>Ownership is saved on this device. Use “Prepare Offline” while online before heading to a flea market.</footer>
<script src="app.js"></script>
</body>
</html>
